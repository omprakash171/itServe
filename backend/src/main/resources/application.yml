spring:
  application:
    name: itserve-backend
  datasource:
    url: jdbc:h2:mem:itserve;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8081}

app:
  jwt:
    secret: ${JWT_SECRET:itserve-dev-only-secret-key-change-me-in-production-0123456789abcdef}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origin-patterns: ${CORS_ORIGINS:http://localhost:[*]}
  seed-demo-data: ${SEED_DEMO_DATA:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.itserve: INFO
